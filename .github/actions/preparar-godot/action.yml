# Deixa o Godot pronto em ~/godot/godot (baixa uma vez e guarda no cache).
# Usado pelos dois jobs do .github/workflows/ci.yml.
name: Preparar o Godot
description: Baixa (ou pega do cache) o Godot para Linux em ~/godot/godot

inputs:
  versao:
    description: Versão do Godot, ex. 4.7.2-stable (a mesma da equipe)
    required: true

runs:
  using: composite
  steps:
    - name: Godot em cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.versao }}-linux

    - name: Baixar o Godot ${{ inputs.versao }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSAO: ${{ inputs.versao }}
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VERSAO}/Godot_v${VERSAO}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${VERSAO}_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot
